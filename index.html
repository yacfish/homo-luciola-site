<script>
(function(){
  var codes = ["fr","en","nl","de","es","it","pt","ar","ja","ko","zh"];
  var aliases = {"zh-cn":"zh","zh-hans":"zh","zh-sg":"zh","zh-my":"zh","zh-tw":"zh","zh-hk":"zh","zh-hant":"zh","zh-mo":"zh","pt-br":"pt","pt-pt":"pt","en-gb":"en","en-us":"en"};
  function pick(raw){
    if (!raw) return null;
    var t = String(raw).toLowerCase().replace(/_/g,"-");
    if (aliases[t]) return aliases[t];
    var short = t.split("-")[0];
    if (aliases[short]) return aliases[short];
    if (codes.indexOf(short) !== -1) return short;
    if (codes.indexOf(t) !== -1) return t;
    return null;
  }
  var stored = null;
  try { stored = localStorage.getItem("hl-lang"); } catch(e) {}
  var nav = (navigator.languages || [navigator.language || ""]).map(function(x){ return x; });
  var choice = pick(stored) || nav.map(pick).filter(Boolean)[0] || "fr";
  location.replace("/" + choice + "/");
})();
</script>
